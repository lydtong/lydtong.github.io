<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Lydia Tong</title>
  <script>
    // SPA redirect for GitHub Pages
    // Converts /work/freelance to /?/work/freelance
    // then index.html picks it up and restores the route
    var path = window.location.pathname;
    window.location.replace(window.location.origin + '/?p=' + encodeURIComponent(path));
  </script>
</head>
<body></body>
</html>
